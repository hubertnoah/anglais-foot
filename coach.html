<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Coach English · Audio</title>
<meta name="robots" content="noindex">
<style>
:root{--navy:#1D3557;--green:#2E9E5B}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',Arial,sans-serif;background:#F4F7FA;color:var(--navy)}
header{background:var(--navy);color:#fff;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:1.5rem;line-height:1.15}header p{margin:8px 0 0}
main{max-width:640px;margin:0 auto;padding:12px 16px 40px}
.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:6px solid var(--green)}
h2{margin:0 0 4px;font-size:1.05rem}p.s{margin:0 0 10px;color:#4B5563;font-size:.92rem}audio{width:100%}
</style></head><body>
<header><h1>Football Coach English</h1><p>Talking to agents and other coaches</p></header>
<main>
<section class="card"><h2>Dialogue 1</h2><p class="s">An agent offers a player</p><audio controls preload="none" src="coach-dialogue-1.mp3"></audio></section>
<section class="card"><h2>Dialogue 2</h2><p class="s">An agent complains about playing time</p><audio controls preload="none" src="coach-dialogue-2.mp3"></audio></section>
<section class="card"><h2>Dialogue 3</h2><p class="s">Two coaches arrange a friendly</p><audio controls preload="none" src="coach-dialogue-3.mp3"></audio></section>
</main>
<script>document.addEventListener('play',e=>{document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);</script>
</body></html>
